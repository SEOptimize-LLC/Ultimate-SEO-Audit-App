# Monthly SEO Workbook — client registry
#
# The lookup every task recipe uses, so no recipe hardcodes a client. Adding a
# ninth client is an entry here, not a code change.
#
# gsc_property  exact string GSC expects; confirmed by the account owner 2026-08-14
# ga4_property  numeric property id, confirmed live by session data 2026-08-14
# sheet_id      Google Sheet, verified readable via the Sheets API
# semrush_project  Position Tracking project id; a project may hold SEVERAL
#               campaigns (city/state/country) and 1.1 reports ALL of them
# brand_token   substring for the GSC 'query contains' branded-impressions filter
# is_local      does 4.4 GBP Fundamentals apply
# ecommerce     does the 1.1 "GA4 Organic Revenue (e-comm only)" row apply
# crawl.posts   patterns picking POST urls: child-sitemap filename or url path
# crawl.money   same, for SERVICE/PRODUCT pages. Utility + PPC pages are
#               excluded globally in crawl_targets.UTILITY
# crawl.money_pages  explicit URL allowlist. When present it WINS over
#               crawl.money entirely - no heuristic, no guessing.


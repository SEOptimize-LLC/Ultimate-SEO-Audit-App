  brand_token: "education walkthrough"
  is_local: false
  ecommerce: false
  crawl:            # subfolder rules, supplied by owner 2026-08-17
    posts: ["post-sitemap"]
    # No `money:` patterns. This block previously carried SameDay's home-services
    # subfolders (/heating/, /plumbing/, /electrical/, /cooling/), copied in and
    # never cleaned. They matched nothing here, so nothing broke, but they would
    # have started matching the day anyone removed money_pages below. EW uses the
